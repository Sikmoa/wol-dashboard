<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Wake-on-LAN Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 380px; }
        h2 { margin-top: 0; font-size: 1.25rem; text-align: center; color: #38bdf8; }
        .input-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.5rem; color: #94a3b8; }
        input { width: 100%; padding: 0.75rem; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 1rem; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { width: 100%; padding: 0.85rem; background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        #status { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <div class="card">
        <h2>PC Wake-on-LAN</h2>
        <div class="input-group">
            <label for="password">Access Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button id="wakeBtn">Wake PC</button>
        <div id="status"></div>
    </div>

    <script>
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.getElementById('wakeBtn').addEventListener('click', async () => {
            const password = document.getElementById('password').value;
            const statusEl = document.getElementById('status');
            statusEl.textContent = "Sending wake signal...";
            statusEl.className = "";

            if (!password) {
                statusEl.textContent = "Please enter the password.";
                statusEl.className = "error";
                return;
            }

            const passwordHash = await sha256(password);

            try {
                // REPLACE WITH YOUR DEPLOYED BACKEND RELAY URL
                const response = await fetch('https://your-backend-relay-url.onrender.com/wake', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passwordHash })
                });

                const data = await response.json();
                if (response.ok) {
                    statusEl.textContent = "Wake packet sent successfully!";
                    statusEl.className = "success";
                } else {
                    statusEl.textContent = data.error || "Failed to wake PC.";
                    statusEl.className = "error";
                }
            } catch (err) {
                statusEl.textContent = "Network error connecting to relay.";
                statusEl.className = "error";
            }
        });
    </script>
</body>
</html>
